name: ci
# Generated by PDLC Phase 4 for membership-api (python3.12-fastapi).
# CI only: test, build and push the image, then publish its digest (job output `digest` and artifact
# image-membership-api). Deploying it is owned by the deployment side.
on:
  pull_request: {}
  push:
    # One long-lived branch per environment; every push builds that branch's image (deployment is outside CI).
    branches: [dev, qa, staging, prod]
    paths-ignore: ["infra/**"]   # infrastructure-only changes need no new application image
permissions:
  contents: read
  id-token: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" || pip install -r requirements.txt
      - run: pytest -q
  image:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.meta.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Build and push image
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${{ vars.ECR_REGISTRY }}"
          docker build -t "${{ vars.ECR_REGISTRY }}/model-switch-e2e-1-phase1-to-3/membership-api:${{ github.ref_name }}-${{ github.sha }}" .
          docker push "${{ vars.ECR_REGISTRY }}/model-switch-e2e-1-phase1-to-3/membership-api:${{ github.ref_name }}-${{ github.sha }}"
      - name: Record immutable build metadata
        id: meta
        env:
          IMAGE_REPO: ${{ vars.ECR_REGISTRY }}/model-switch-e2e-1-phase1-to-3/membership-api
          IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          digest=$(aws ecr describe-images --repository-name "model-switch-e2e-1-phase1-to-3/membership-api" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          python -c 'import json,os,sys; json.dump({"component":"membership-api","digest":sys.argv[1],"sha":os.environ["BUILD_SHA"]},open("image.json","w"))' "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: image-membership-api
          path: image.json
